name: QA Automation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quality + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Public demo app used by the canonical UI example (SauceDemo checkout) — not a secret.
      SAUCEDEMO_BASE_URL: https://www.saucedemo.com
      HEADLESS: 'true'
      BROWSER: chromium
      # Default CI run excludes @db: no Oracle credentials needed.
      DB_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Quality (typecheck + lint + format:check + test:unit)
        run: npm run quality

      - name: Tests (excludes @db)
        run: npm test

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports
          path: |
            reports/cucumber/cucumber-report.json
            reports/cucumber/cucumber-report.html
          if-no-files-found: ignore
